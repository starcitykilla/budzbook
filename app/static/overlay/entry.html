<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Entry Overlay</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1920px; height:1080px; background:transparent; overflow:hidden; }
  body { font-family:'Arial Black','Helvetica Neue',Arial,sans-serif; }

  /* ---------- 3D stage ---------- */
  #stage { position:absolute; left:80px; top:330px; width:660px; height:420px; perspective:1500px; }
  #card { position:absolute; left:0; top:20px; width:620px; height:360px; transform-style:preserve-3d; opacity:0; }

  /* entrance / idle / exit */
  #card.enter { transition:transform 1.05s cubic-bezier(.16,1.35,.3,1), opacity .35s ease;
                transform:translateX(0) rotateY(0deg) scale(1); opacity:1; }
  #card.pre   { transform:translateX(-850px) rotateY(-72deg) scale(.82); opacity:0; }
  #card.idle  { animation:floaty 4.2s ease-in-out infinite; }
  #card.exit  { animation:none; transition:transform .7s ease-in, opacity .55s ease;
                transform:translateX(850px) rotateY(62deg) scale(.9); opacity:0; }
  @keyframes floaty {
    0%,100% { transform:translateY(0) rotateY(-5deg) rotateX(2deg); }
    50%     { transform:translateY(-14px) rotateY(5deg) rotateX(-2deg); }
  }

  /* ---------- card layers (depth via translateZ) ---------- */
  .glow { position:absolute; inset:-60px; border-radius:60px;
          background:radial-gradient(ellipse at center, rgba(232,195,74,.34), transparent 65%);
          filter:blur(18px); transform:translateZ(-120px); }
  .base { position:absolute; inset:0; border-radius:30px;
          background:linear-gradient(135deg, rgba(8,12,10,.97), rgba(18,30,22,.97) 60%, rgba(8,12,10,.97));
          border:4px solid #d4af37;
          box-shadow:0 0 70px rgba(212,175,55,.4), inset 0 0 46px rgba(0,0,0,.65);
          transform:translateZ(0); }
  .edge { position:absolute; inset:10px; border-radius:22px; border:2px solid rgba(232,195,74,.35);
          transform:translateZ(6px); pointer-events:none; }

  .avatar-wrap { position:absolute; left:44px; top:82px; width:196px; height:196px;
                 transform:translateZ(78px); }
  .avatar-wrap .ring { position:absolute; inset:0; border-radius:50%;
      background:conic-gradient(#f6e27a,#d4af37,#8a6d1f,#f6e27a,#d4af37);
      box-shadow:0 0 44px rgba(232,195,74,.75); animation:ringspin 7s linear infinite; }
  @keyframes ringspin { to { transform:rotate(360deg); } }
  .avatar-wrap img, .avatar-wrap .initial { position:absolute; inset:12px; border-radius:50%; }
  .avatar-wrap img { width:172px; height:172px; object-fit:cover; background:#111; }
  .avatar-wrap .initial { width:172px; height:172px; display:flex; align-items:center; justify-content:center;
      font-size:96px; color:#0a0c0a; background:radial-gradient(circle at 35% 30%, #f6e27a, #b8912c); }

  .name { position:absolute; left:272px; top:96px; width:330px;
          font-size:60px; line-height:1.02; letter-spacing:1px; color:#fff;
          background:linear-gradient(180deg,#fff8e1 20%,#e8c34a 55%,#9a7a24 90%);
          -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
          filter:drop-shadow(0 3px 6px rgba(0,0,0,.8));
          transform:translateZ(48px); }
  .ribbon { position:absolute; left:272px; top:212px; padding:10px 26px 10px 22px;
            background:linear-gradient(90deg,#1d7a46,#35d07f); border-radius:12px;
            color:#04120a; font-size:34px; letter-spacing:4px; white-space:nowrap;
            box-shadow:0 6px 22px rgba(53,208,127,.5);
            transform:translateZ(66px) rotateX(8deg); }
  .brand { position:absolute; left:276px; top:286px; font-size:21px; letter-spacing:7px;
           color:rgba(232,195,74,.85); font-family:Arial,sans-serif; font-weight:bold;
           transform:translateZ(34px); }

  .shine { position:absolute; top:-25%; bottom:-25%; width:130px; left:-180px;
           background:linear-gradient(105deg, transparent, rgba(255,255,255,.38), transparent);
           transform:translateZ(95px) rotate(16deg); pointer-events:none; }
  #card.enter .shine { animation:sweep 1.25s .35s ease forwards; }
  @keyframes sweep { to { left:760px; } }

  /* ---------- rising gold sparks ---------- */
  .spark { position:absolute; bottom:30px; width:10px; height:10px; border-radius:50%;
           background:radial-gradient(circle,#ffe9a8,#d4af37 70%,transparent);
           opacity:0; transform:translateZ(110px); pointer-events:none; }
  #card.enter .spark, #card.idle .spark { animation:rise 2.6s ease-in infinite; }
  @keyframes rise {
    0%   { opacity:0; transform:translateZ(110px) translateY(0) scale(.6); }
    18%  { opacity:1; }
    100% { opacity:0; transform:translateZ(110px) translateY(-260px) translateX(var(--dx)) scale(1.15); }
  }
</style>
</head>
<body>
  <div id="stage">
    <div id="card" class="pre">
      <div class="glow"></div>
      <div class="base"></div>
      <div class="edge"></div>
      <div class="avatar-wrap">
        <div class="ring"></div>
        <img id="avatarImg" alt="" style="display:none">
        <div class="initial" id="avatarInit">?</div>
      </div>
      <div class="name" id="uname">VIEWER</div>
      <div class="ribbon">IN THE HOUSE</div>
      <div class="brand">BUDZBOOK &bull; T.H.C.</div>
      <div class="shine"></div>
    </div>
  </div>

<script>
(function(){
  var card = document.getElementById('card');
  var uname = document.getElementById('uname');
  var avatarImg = document.getElementById('avatarImg');
  var avatarInit = document.getElementById('avatarInit');
  var lastNonce = 0, busy = false, timers = [];

  // build sparks
  var stage = document.getElementById('stage');
  for (var i = 0; i < 16; i++) {
    var s = document.createElement('div');
    s.className = 'spark';
    s.style.left = (40 + Math.random() * 560) + 'px';
    s.style.setProperty('--dx', ((Math.random() * 120) - 60) + 'px');
    s.style.animationDelay = (Math.random() * 2.4) + 's';
    var sz = 6 + Math.random() * 9;
    s.style.width = s.style.height = sz + 'px';
    card.appendChild(s);
  }

  function fitName(n){
    var len = n.length;
    uname.style.fontSize = len > 16 ? '38px' : len > 12 ? '48px' : '60px';
  }

  function show(d){
    busy = true;
    var name = (d.display || d.username || 'VIEWER').toUpperCase();
    uname.textContent = name;
    fitName(name);
    if (d.avatar) {
      avatarImg.src = d.avatar;
      avatarImg.style.display = 'block';
      avatarInit.style.display = 'none';
    } else {
      avatarImg.style.display = 'none';
      avatarInit.style.display = 'flex';
      avatarInit.textContent = name.charAt(0) || '?';
    }
    card.classList.remove('pre','exit');
    void card.offsetWidth; /* restart transitions */
    card.classList.add('enter');
    timers.push(setTimeout(function(){ card.classList.add('idle'); }, 1150));
    timers.push(setTimeout(function(){
      card.classList.remove('enter','idle');
      card.classList.add('exit');
    }, 6800));
    timers.push(setTimeout(function(){
      card.classList.remove('exit');
      card.classList.add('pre');
      busy = false;
    }, 7700));
  }

  async function poll(){
    try {
      var r = await fetch('triggers/entry.json?t=' + Date.now(), {cache:'no-store'});
      if (r.ok) {
        var d = await r.json();
        if (d && d.nonce > lastNonce && !busy) { lastNonce = d.nonce; show(d); }
        else if (d && d.nonce > lastNonce) { lastNonce = d.nonce; }
      }
    } catch(e) {}
  }
  setInterval(poll, 1000);
  poll();
})();
</script>
</body>
</html>
