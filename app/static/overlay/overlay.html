<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>BudzBook Overlay - unified</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1920px; height:1080px; background:transparent; overflow:hidden; }
  body { font-family:'Arial Black','Helvetica Neue',Arial,sans-serif; }

  /* ================= ENTRY CARD (bottom-left) ================= */
  #stage-entry { position:absolute; left:80px; top:330px; width:660px; height:420px; perspective:1500px; }
  #card-entry { position:absolute; left:0; top:20px; width:620px; height:360px; transform-style:preserve-3d; opacity:0; }
  #card-entry.enter { transition:transform 1.05s cubic-bezier(.16,1.35,.3,1), opacity .35s ease;
                transform:translateX(0) rotateY(0deg) scale(1); opacity:1; }
  #card-entry.pre   { transform:translateX(-850px) rotateY(-72deg) scale(.82); opacity:0; }
  #card-entry.idle  { animation:floaty 4.2s ease-in-out infinite; }
  #card-entry.exit  { animation:none; transition:transform .7s ease-in, opacity .55s ease;
                transform:translateX(850px) rotateY(62deg) scale(.9); opacity:0; }
  @keyframes floaty {
    0%,100% { transform:translateY(0) rotateY(-5deg) rotateX(2deg); }
    50%     { transform:translateY(-14px) rotateY(5deg) rotateX(-2deg); }
  }
  #stage-entry .glow { position:absolute; inset:-60px; border-radius:60px;
          background:radial-gradient(ellipse at center, rgba(232,195,74,.34), transparent 65%);
          filter:blur(18px); transform:translateZ(-120px); }
  #stage-entry .base { position:absolute; inset:0; border-radius:30px;
          background:linear-gradient(135deg, rgba(8,12,10,.97), rgba(18,30,22,.97) 60%, rgba(8,12,10,.97));
          border:4px solid #d4af37;
          box-shadow:0 0 70px rgba(212,175,55,.4), inset 0 0 46px rgba(0,0,0,.65);
          transform:translateZ(0); }
  #stage-entry .edge { position:absolute; inset:10px; border-radius:22px; border:2px solid rgba(232,195,74,.35);
          transform:translateZ(6px); pointer-events:none; }
  #stage-entry .avatar-wrap { position:absolute; left:44px; top:82px; width:196px; height:196px;
                 transform:translateZ(78px); }
  #stage-entry .avatar-wrap .ring { position:absolute; inset:0; border-radius:50%;
      background:conic-gradient(#f6e27a,#d4af37,#8a6d1f,#f6e27a,#d4af37);
      box-shadow:0 0 44px rgba(232,195,74,.75); animation:ringspin 7s linear infinite; }
  @keyframes ringspin { to { transform:rotate(360deg); } }
  #stage-entry .avatar-wrap img, #stage-entry .avatar-wrap .initial { position:absolute; inset:12px; border-radius:50%; }
  #stage-entry .avatar-wrap img { width:172px; height:172px; object-fit:cover; background:#111; }
  #stage-entry .avatar-wrap .initial { width:172px; height:172px; display:flex; align-items:center; justify-content:center;
      font-size:96px; color:#0a0c0a; background:radial-gradient(circle at 35% 30%, #f6e27a, #b8912c); }
  #stage-entry .name { position:absolute; left:272px; top:96px; width:330px;
          font-size:60px; line-height:1.02; letter-spacing:1px; color:#fff;
          background:linear-gradient(180deg,#fff8e1 20%,#e8c34a 55%,#9a7a24 90%);
          -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
          filter:drop-shadow(0 3px 6px rgba(0,0,0,.8));
          transform:translateZ(48px); }
  #stage-entry .ribbon { position:absolute; left:272px; top:212px; padding:10px 26px 10px 22px;
            background:linear-gradient(90deg,#1d7a46,#35d07f); border-radius:12px;
            color:#04120a; font-size:34px; letter-spacing:4px; white-space:nowrap;
            box-shadow:0 6px 22px rgba(53,208,127,.5);
            transform:translateZ(66px) rotateX(8deg); }
  #stage-entry .brand { position:absolute; left:276px; top:286px; font-size:21px; letter-spacing:7px;
           color:rgba(232,195,74,.85); font-family:Arial,sans-serif; font-weight:bold;
           transform:translateZ(34px); }
  #stage-entry .shine { position:absolute; top:-25%; bottom:-25%; width:130px; left:-180px;
           background:linear-gradient(105deg, transparent, rgba(255,255,255,.38), transparent);
           transform:translateZ(95px) rotate(16deg); pointer-events:none; }
  #card-entry.enter .shine { animation:sweep 1.25s .35s ease forwards; }
  @keyframes sweep { to { left:760px; } }
  #stage-entry .spark { position:absolute; bottom:30px; width:10px; height:10px; border-radius:50%;
           background:radial-gradient(circle,#ffe9a8,#d4af37 70%,transparent);
           opacity:0; transform:translateZ(110px); pointer-events:none; }
  #card-entry.enter .spark, #card-entry.idle .spark { animation:rise 2.6s ease-in infinite; }
  @keyframes rise {
    0%   { opacity:0; transform:translateZ(110px) translateY(0) scale(.6); }
    18%  { opacity:1; }
    100% { opacity:0; transform:translateZ(110px) translateY(-260px) translateX(var(--dx)) scale(1.15); }
  }

  /* ================= FLAIR CARD (center) ================= */
  body.giants  { --c1:#0b2265; --c2:#a7194b; --glow:rgba(11,34,101,.85);  --txt1:#dfe8ff; --txt2:#7fa0e8; }
  body.cowboys { --c1:#003594; --c2:#c0c5ce; --glow:rgba(0,53,148,.85);   --txt1:#f2f5fa; --txt2:#9fb4d8; }
  #stage-flair { position:absolute; left:560px; top:230px; width:800px; height:620px; perspective:1500px; }
  #card-flair { position:absolute; left:50px; top:60px; width:700px; height:460px; transform-style:preserve-3d; opacity:0; }
  #card-flair.enter { transition:transform 1.0s cubic-bezier(.16,1.35,.3,1), opacity .35s ease;
                transform:translateY(0) rotateX(0deg) scale(1); opacity:1; }
  #card-flair.pre   { transform:translateY(-420px) rotateX(-78deg) scale(.85); opacity:0; }
  #card-flair.idle  { animation:sway 3.8s ease-in-out infinite; }
  #card-flair.exit  { animation:none; transition:transform .65s ease-in, opacity .5s ease;
                transform:translateY(420px) rotateX(72deg) scale(.9); opacity:0; }
  @keyframes sway {
    0%,100% { transform:rotateX(4deg) rotateY(-6deg); }
    50%     { transform:rotateX(-4deg) rotateY(6deg); }
  }
  #stage-flair .burst { position:absolute; left:50%; top:46%; width:640px; height:640px; margin:-320px;
           background:var(--c1);
           clip-path:polygon(50% 0%,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);
           opacity:.5; filter:blur(2px) drop-shadow(0 0 46px var(--glow));
           transform:translateZ(-140px); animation:spin 26s linear infinite; }
  @keyframes spin { to { transform:translateZ(-140px) rotate(360deg); } }
  #stage-flair .glow { position:absolute; inset:-70px; border-radius:70px;
          background:radial-gradient(ellipse at center, var(--glow), transparent 62%);
          filter:blur(22px); transform:translateZ(-90px); }
  #stage-flair .base { position:absolute; inset:0; border-radius:34px;
          background:linear-gradient(150deg, rgba(6,8,14,.97), color-mix(in srgb, var(--c1) 42%, #06080e) 55%, rgba(6,8,14,.97));
          border:4px solid var(--c2);
          box-shadow:0 0 80px var(--glow), inset 0 0 50px rgba(0,0,0,.6);
          transform:translateZ(0); }
  #stage-flair .edge { position:absolute; inset:11px; border-radius:26px; border:2px solid rgba(255,255,255,.28);
          transform:translateZ(6px); }
  #stage-flair .team { position:absolute; left:0; right:0; top:52px; text-align:center; font-size:74px; letter-spacing:10px;
          background:linear-gradient(180deg,var(--txt1) 25%,var(--txt2) 60%,var(--c2) 95%);
          -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
          filter:drop-shadow(0 4px 8px rgba(0,0,0,.85));
          transform:translateZ(52px); }
  #stage-flair .reason { position:absolute; left:0; right:0; top:158px; text-align:center; font-size:104px; letter-spacing:3px;
            color:#fff; filter:drop-shadow(0 0 26px var(--glow)) drop-shadow(0 5px 8px rgba(0,0,0,.9));
            transform:translateZ(88px); }
  #stage-flair .sub { position:absolute; left:0; right:0; top:300px; text-align:center;
         font-family:Arial,sans-serif; font-weight:bold; font-size:30px; letter-spacing:12px;
         color:var(--txt2); transform:translateZ(40px); }
  #stage-flair .brand { position:absolute; left:0; right:0; top:368px; text-align:center;
           font-family:Arial,sans-serif; font-weight:bold; font-size:22px; letter-spacing:9px;
           color:rgba(255,255,255,.55); transform:translateZ(28px); }
  #stage-flair .shine { position:absolute; top:-25%; bottom:-25%; width:140px; left:-200px;
           background:linear-gradient(105deg, transparent, rgba(255,255,255,.4), transparent);
           transform:translateZ(100px) rotate(16deg); pointer-events:none; }
  #card-flair.enter .shine { animation:sweepF 1.2s .35s ease forwards; }
  @keyframes sweepF { to { left:820px; } }
  #stage-flair .confetti { position:absolute; top:-30px; width:14px; height:22px; opacity:0;
              transform:translateZ(120px); pointer-events:none; }
  #card-flair.enter .confetti, #card-flair.idle .confetti { animation:fall 3.1s ease-in infinite; }
  @keyframes fall {
    0%   { opacity:0; transform:translateZ(120px) translateY(-20px) rotate(0deg); }
    12%  { opacity:1; }
    100% { opacity:0; transform:translateZ(120px) translateY(560px) translateX(var(--dx)) rotate(720deg); }
  }

  /* ================= HUG CAM (center-bottom) ================= */
  #stage-hug { position:absolute; zoom:.25; left:50%; bottom:40px; transform:translateX(-50%);
               width:560px; text-align:center;
               transition:opacity .45s ease, transform .45s ease; pointer-events:none; }
  #stage-hug.hide { opacity:0; transform:translateX(-50%) translateY(30px); }
  #stage-hug.show { opacity:1; transform:translateX(-50%) translateY(0); }
  #hug-caption { font-size:44px; letter-spacing:2px; color:#f6e27a;
                 text-shadow:0 0 18px rgba(232,195,74,.9), 0 3px 8px rgba(0,0,0,.9);
                 margin-bottom:6px; white-space:nowrap; }
  #hug-video { width:560px; height:auto; display:block; margin:0 auto; }

  /* ================= TEAM HYPE (center-bottom) ================= */
  #stage-team { position:absolute; left:50%; bottom:40px; transform:translateX(-50%);
               width:560px; text-align:center;
               transition:opacity .45s ease, transform .45s ease; pointer-events:none; }
  #stage-team.hide { opacity:0; transform:translateX(-50%) translateY(30px); }
  #stage-team.show { opacity:1; transform:translateX(-50%) translateY(0); }
  #team-caption { font-size:44px; letter-spacing:2px; color:#f6e27a;
                 text-shadow:0 0 18px rgba(232,195,74,.9), 0 3px 8px rgba(0,0,0,.9);
                 margin-bottom:6px; white-space:nowrap; }
  #team-video { width:560px; height:auto; display:block; margin:0 auto; }
  /* ================= SWEAT TICKER (top-right) ================= */
  #stage-sweat { position:absolute; right:28px; top:28px; width:332px;
                 background:rgba(0,0,0,.55); border:2px solid rgba(212,175,55,.85);
                 border-radius:16px; padding:14px 16px 10px; color:#fff;
                 transition:opacity .5s ease; pointer-events:none; }
  #stage-sweat.hide { opacity:0; }
  #stage-sweat .sweat-head { display:flex; align-items:center; gap:10px;
                 font-size:22px; letter-spacing:3px; color:#f6e27a;
                 text-shadow:0 2px 6px rgba(0,0,0,.9); margin-bottom:8px; }
  #stage-sweat .dot { width:14px; height:14px; border-radius:50%; background:#ff3b30;
                 box-shadow:0 0 12px rgba(255,59,48,.9); animation:pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { transform:scale(1); opacity:1; } 50% { transform:scale(.72); opacity:.65; } }
  #stage-sweat .sweat-ticket { margin-bottom:8px; }
  #stage-sweat .sweat-tlabel { font-size:19px; letter-spacing:2px; color:#e8c34a;
                 border-bottom:1px solid rgba(212,175,55,.45); padding-bottom:4px; margin-bottom:6px; }
  #stage-sweat .sweat-leg { display:flex; justify-content:space-between; align-items:baseline;
                 font-family:Arial,sans-serif; font-weight:bold; font-size:18px;
                 padding:3px 0; text-shadow:0 2px 5px rgba(0,0,0,.95); }
  #stage-sweat .sweat-leg .teams { white-space:nowrap; }
  #stage-sweat .sweat-leg .det { font-size:15px; color:#cfd6da; font-weight:normal;
                 margin-left:10px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #stage-sweat .sweat-foot { margin-top:6px; font-family:Arial,sans-serif; font-size:13px;
                 letter-spacing:1px; color:rgba(255,255,255,.6); text-align:right; }
  @media (prefers-reduced-motion: reduce) { #stage-sweat .dot { animation:none; } }
</style>
</head>
<body class="giants">

  <!-- ENTRY -->
  <div id="stage-entry">
    <div id="card-entry" class="pre">
      <div class="glow"></div>
      <div class="base"></div>
      <div class="edge"></div>
      <div class="avatar-wrap">
        <div class="ring"></div>
        <img id="avatarImg-entry" alt="" style="display:none">
        <div class="initial" id="avatarInit-entry">?</div>
      </div>
      <div class="name" id="uname-entry">VIEWER</div>
      <div class="ribbon">IN THE HOUSE</div>
      <div class="brand">BUDZBOOK &bull; T.H.C.</div>
      <div class="shine"></div>
    </div>
  </div>

  <!-- FLAIR -->
  <div id="stage-flair">
    <div id="card-flair" class="pre">
      <div class="burst"></div>
      <div class="glow"></div>
      <div class="base"></div>
      <div class="edge"></div>
      <div class="team" id="team-flair">GIANTS</div>
      <div class="reason" id="reason-flair">TOUCHDOWN!</div>
      <div class="sub">FAN FLAIR</div>
      <div class="brand">BUDZBOOK &bull; T.H.C.</div>
      <div class="shine"></div>
    </div>
  </div>

  <!-- HUG -->
  <div id="stage-hug" class="hide">
    <div id="hug-caption"></div>
    <video id="hug-video" src="hug.webm" muted playsinline preload="auto"></video>
  </div>

  <!-- TEAM HYPE -->
  <div id="stage-team" class="hide">
    <div id="team-caption"></div>
    <video id="team-video" src="team.webm" muted playsinline preload="auto"></video>
  <!-- SWEAT TICKER -->
  <div id="stage-sweat" class="hide">
    <div class="sweat-head"><span class="dot"></span><span>BUDZ PICKS SWEAT</span></div>
    <div id="sweat-body"></div>
    <div class="sweat-foot" id="sweat-foot"></div>
  </div>

<script>
(function(){
  /* ---------- shared scheduler: one animation at a time, rest queue ---------- */
  var queue = [];
  var busy = false;

  function pump(){
    if (!busy && queue.length) {
      var job = queue.shift();
      busy = true;
      job.show(job.d);
    }
  }
  setInterval(pump, 300);

  /* ================= ENTRY ================= */
  var cardE = document.getElementById('card-entry');
  var unameE = document.getElementById('uname-entry');
  var avatarImgE = document.getElementById('avatarImg-entry');
  var avatarInitE = document.getElementById('avatarInit-entry');
  (function buildSparks(){
    for (var i = 0; i < 16; i++) {
      var s = document.createElement('div');
      s.className = 'spark';
      s.style.left = (40 + Math.random() * 560) + 'px';
      s.style.setProperty('--dx', ((Math.random() * 120) - 60) + 'px');
      s.style.animationDelay = (Math.random() * 2.4) + 's';
      var sz = 6 + Math.random() * 9;
      s.style.width = s.style.height = sz + 'px';
      cardE.appendChild(s);
    }
  })();
  function fitName(n){
    var len = n.length;
    unameE.style.fontSize = len > 16 ? '38px' : len > 12 ? '48px' : '60px';
  }
  function showEntry(d){
    var name = (d.display || d.username || 'VIEWER').toUpperCase();
    unameE.textContent = name;
    fitName(name);
    if (d.avatar) {
      avatarImgE.src = d.avatar;
      avatarImgE.style.display = 'block';
      avatarInitE.style.display = 'none';
    } else {
      avatarImgE.style.display = 'none';
      avatarInitE.style.display = 'flex';
      avatarInitE.textContent = name.charAt(0) || '?';
    }
    cardE.classList.remove('pre','exit');
    void cardE.offsetWidth;
    cardE.classList.add('enter');
    setTimeout(function(){ cardE.classList.add('idle'); }, 1150);
    setTimeout(function(){
      cardE.classList.remove('enter','idle');
      cardE.classList.add('exit');
    }, 6800);
    setTimeout(function(){
      cardE.classList.remove('exit');
      cardE.classList.add('pre');
      busy = false;
    }, 7700);
  }

  /* ================= FLAIR ================= */
  var cardF = document.getElementById('card-flair');
  var teamEl = document.getElementById('team-flair');
  var reasonEl = document.getElementById('reason-flair');
  var WORDS = { giants:'GIANTS', cowboys:'COWBOYS' };
  var CONF  = { giants:['#0b2265','#a7194b','#ffffff','#7fa0e8'],
                cowboys:['#003594','#c0c5ce','#ffffff','#7fa8e0'] };
  var confetti = [];
  (function buildConfetti(){
    for (var i = 0; i < 30; i++) {
      var c = document.createElement('div');
      c.className = 'confetti';
      c.style.left = (Math.random() * 700) + 'px';
      c.style.setProperty('--dx', ((Math.random() * 220) - 110) + 'px');
      c.style.animationDelay = (Math.random() * 2.8) + 's';
      cardF.appendChild(c);
      confetti.push(c);
    }
  })();
  function fitReason(r){
    var len = r.length;
    reasonEl.style.fontSize = len > 18 ? '64px' : len > 12 ? '84px' : '104px';
  }
  function showFlair(d){
    var team = (d.team === 'cowboys') ? 'cowboys' : 'giants';
    document.body.className = team;
    teamEl.textContent = WORDS[team];
    var reason = (d.reason || 'TOUCHDOWN!').toUpperCase();
    reasonEl.textContent = reason;
    fitReason(reason);
    var palette = CONF[team];
    confetti.forEach(function(c, i){ c.style.background = palette[i % palette.length]; });
    cardF.classList.remove('pre','exit');
    void cardF.offsetWidth;
    cardF.classList.add('enter');
    setTimeout(function(){ cardF.classList.add('idle'); }, 1100);
    setTimeout(function(){
      cardF.classList.remove('enter','idle');
      cardF.classList.add('exit');
    }, 6000);
    setTimeout(function(){
      cardF.classList.remove('exit');
      cardF.classList.add('pre');
      busy = false;
    }, 6800);
  }

  /* ================= HUG ================= */
  var stageH = document.getElementById('stage-hug');
  var videoH = document.getElementById('hug-video');
  var captionH = document.getElementById('hug-caption');
  var hideTimerH = null;
  function finishHug(){
    if (hideTimerH) { clearTimeout(hideTimerH); hideTimerH = null; }
    stageH.classList.remove('show');
    stageH.classList.add('hide');
    try { videoH.pause(); } catch(e) {}
    busy = false;
  }
  videoH.addEventListener('ended', function(){ setTimeout(finishHug, 900); });
  function showHug(d){
    var from = (d.from || 'KRZY_BUDZ').toUpperCase();
    var to = (d.to || 'QUEENSHIDA').toUpperCase();
    captionH.textContent = '🤗 ' + from + ' hugs ' + to;
    stageH.classList.remove('hide');
    void stageH.offsetWidth;
    stageH.classList.add('show');
    try {
      videoH.currentTime = 0;
      var p = videoH.play();
      if (p && p.catch) { p.catch(function(){ finishHug(); }); }
    } catch(e) { finishHug(); return; }
    hideTimerH = setTimeout(finishHug, 16000);
  }

  /* ================= TEAM HYPE ================= */
  var stageT = document.getElementById('stage-team');
  var videoT = document.getElementById('team-video');
  var captionT = document.getElementById('team-caption');
  var hideTimerT = null;
  function finishTeam(){
    if (hideTimerT) { clearTimeout(hideTimerT); hideTimerT = null; }
    stageT.classList.remove('show');
    stageT.classList.add('hide');
    try { videoT.pause(); } catch(e) {}
    busy = false;
  }
  videoT.addEventListener('ended', function(){ setTimeout(finishTeam, 900); });
  function showTeam(d){
    captionT.textContent = '\u{1F3C8} TEAM HYPE \u2014 LET\'S GOOOO!';
    stageT.classList.remove('hide');
    void stageT.offsetWidth;
    stageT.classList.add('show');
    try {
      videoT.currentTime = 0;
      var p = videoT.play();
      if (p && p.catch) { p.catch(function(){ finishTeam(); }); }
    } catch(e) { finishTeam(); return; }
    hideTimerT = setTimeout(finishTeam, 16000);
  }
  /* ================= SWEAT TICKER ================= */
  var stageS = document.getElementById('stage-sweat');
  var sweatBody = document.getElementById('sweat-body');
  var sweatFoot = document.getElementById('sweat-foot');

  function legMark(leg){
    if (leg.state === 'post') {
      return leg.result === 'won' ? ' ✅' : (leg.result === 'lost' ? ' ❌' : '');
    }
    return '';
  }
  function renderSweat(d){
    while (sweatBody.firstChild) sweatBody.removeChild(sweatBody.firstChild);
    d.tickets.forEach(function(t){
      var ticket = document.createElement('div');
      ticket.className = 'sweat-ticket';
      var label = document.createElement('div');
      label.className = 'sweat-tlabel';
      label.textContent = (t.status === 'final' ? '🏁 ' : '🔴 ') +
                          String(t.label || 'TICKET').toUpperCase() +
                          (t.record ? ' · ' + t.record : '');
      ticket.appendChild(label);
      (t.legs || []).forEach(function(leg){
        var row = document.createElement('div');
        row.className = 'sweat-leg';
        var teams = document.createElement('span');
        teams.className = 'teams';
        var score = leg.score ? ' ' + leg.score + ' ' : ' vs ';
        teams.textContent = String(leg.abbr || '') + score + String(leg.opp_abbr || '') + legMark(leg);
        var det = document.createElement('span');
        det.className = 'det';
        det.textContent = String(leg.detail || '');
        row.appendChild(teams);
        row.appendChild(det);
        ticket.appendChild(row);
      });
      sweatBody.appendChild(ticket);
    });
    try {
      var upd = new Date(d.updated_at);
      sweatFoot.textContent = 'Updated ' + upd.toLocaleTimeString('en-US',
        {hour:'numeric', minute:'2-digit', timeZone:'America/New_York'}) + ' ET';
    } catch(e) { sweatFoot.textContent = ''; }
  }
  async function pollSweat(){
    try {
      var r = await fetch('triggers/sweat.json?t=' + Date.now(), {cache:'no-store'});
      if (!r.ok) { stageS.classList.add('hide'); return; }
      var d = await r.json();
      if (!d || !d.live || !d.tickets || !d.tickets.length) {
        stageS.classList.add('hide'); return;
      }
      renderSweat(d);
      stageS.classList.remove('hide');
    } catch(e) { stageS.classList.add('hide'); }
  }
  setInterval(pollSweat, 15000);
  pollSweat();

  /* ================= TRIGGER POLLING ================= */
  var watchers = [
    { file:'triggers/entry.json', last:0, show:showEntry },
    { file:'triggers/flair.json', last:0, show:showFlair },
    { file:'triggers/hug.json',   last:0, show:showHug   },
    { file:'triggers/team.json',  last:0, show:showTeam  }
  ];
  async function poll(){
    for (var i = 0; i < watchers.length; i++) {
      var w = watchers[i];
      try {
        var r = await fetch(w.file + '?t=' + Date.now(), {cache:'no-store'});
        if (r.ok) {
          var d = await r.json();
          if (d && d.nonce > w.last) { w.last = d.nonce; queue.push({show:w.show, d:d}); }
        }
      } catch(e) {}
    }
  }
  setInterval(poll, 1000);
  poll();
})();
</script>
