<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Team Hype Overlay</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1920px; height:1080px; background:transparent; overflow:hidden; }
  body { font-family:'Arial Black','Helvetica Neue',Arial,sans-serif; }

  #team-stage {
    position:absolute; left:50%; bottom:56px; transform:translateX(-50%);
    width:460px; text-align:center;
    opacity:0; transition:opacity .45s ease, transform .55s cubic-bezier(.16,1.35,.3,1);
    transform:translateX(-50%) scale(.82);
    pointer-events:none;
  }
  #team-stage.show { opacity:1; transform:translateX(-50%) scale(1); }
  #team-stage.hide { opacity:0; transform:translateX(-50%) scale(.94); transition:opacity .6s ease, transform .6s ease; }

  #team-caption {
    font-size:40px; letter-spacing:2px; color:#fff; margin-bottom:10px;
    background:linear-gradient(180deg,#fff8e1 20%,#e8c34a 55%,#9a7a24 90%);
    -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
    filter:drop-shadow(0 3px 6px rgba(0,0,0,.85));
    white-space:nowrap;
  }
  #team-video {
    width:460px; height:auto; display:block; margin:0 auto;
    filter:drop-shadow(0 0 34px rgba(232,195,74,.45));
  }
</style>
</head>
<body>
  <div id="team-stage">
    <div id="team-caption"></div>
    <video id="team-video" src="team.webm" muted playsinline preload="auto"></video>
  </div>

<script>
(function(){
  var stage = document.getElementById('team-stage');
  var caption = document.getElementById('team-caption');
  var video = document.getElementById('team-video');
  var lastNonce = 0, busy = false, hideTimer = null;

  function finish(){
    if (hideTimer) { clearTimeout(hideTimer); hideTimer = null; }
    stage.classList.remove('show');
    stage.classList.add('hide');
    setTimeout(function(){
      stage.classList.remove('hide');
      try { video.pause(); } catch(e) {}
      busy = false;
    }, 650);
  }

  function show(d){
    busy = true;
    var who = (d.from || 'KRZY_BUDZ').toUpperCase();
    caption.textContent = '\u{1F3C8} TEAM HYPE \u2014 LET\'S GOOOO!';
    stage.classList.remove('hide');
    void stage.offsetWidth; /* restart transition */
    stage.classList.add('show');
    try {
      video.currentTime = 0;
      var p = video.play();
      if (p && p.catch) { p.catch(function(){ finish(); }); }
    } catch(e) { finish(); return; }
    /* safety: never stay stuck on screen */
    hideTimer = setTimeout(finish, 16000);
  }

  video.addEventListener('ended', function(){
    setTimeout(finish, 900);
  });

  async function poll(){
    try {
      var r = await fetch('triggers/team.json?t=' + Date.now(), {cache:'no-store'});
      if (r.ok) {
        var d = await r.json();
        if (d && d.nonce > lastNonce) {
          lastNonce = d.nonce;
          if (!busy) { show(d); }
        }
      }
    } catch(e) {}
  }
  setInterval(poll, 1000);
  poll();
})();
</script>
</body>
</html>
