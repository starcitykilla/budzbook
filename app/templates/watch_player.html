{% extends "base.html" %}
{% block title %}Watch @{{ channel }} - BudzBook{% endblock %}
{% block content %}
<h2>&#x1F534; @{{ channel }} - Live on Twitch</h2>
<p><a href="/watch">&larr; All followed streams</a></p>
<div class="watch-grid">
  <div class="watch-player">
    <iframe src="{{ player_url }}" title="Twitch stream" allowfullscreen></iframe>
  </div>
  <div class="watch-chat">
    <iframe src="{{ chat_url }}" title="Twitch chat"></iframe>
  </div>
</div>
<p><a href="https://www.twitch.tv/{{ channel }}" target="_blank" rel="noopener">Open on Twitch &#x2197;</a></p>
{% endblock %}
